[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk3588-mediaboxd"
version = "0.1.0"
description = "Low-dependency RK3588 MediaBox control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mediaboxd = "mediaboxd.__main__:main"

[tool.setuptools]
packages = ["mediaboxd"]
