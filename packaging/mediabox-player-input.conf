# What the remote can do while a film is playing.
#
# mpv's own defaults cover the rest; these are the two that belong to this
# appliance rather than to mpv.

# Send this film to Kodi, at the second it has reached. The equivalent of
# "open in an external player": the same film, the same place, in the
# application that is better at the rest of the evening.
k script-message-to mediabox handoff
ENTER script-message-to mediabox handoff

# Back leaves the film and returns to the page it was chosen from. It does not
# stop the appliance, and it does not hand the display to anything.
ESC quit
BS quit
