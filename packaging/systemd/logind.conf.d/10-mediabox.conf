# An appliance's power keys are the appliance's, not login manager's.
#
# Belt to the udev rule's braces. The rule stops logind from watching the CEC
# remote at all; this makes the outcome harmless even on a device that keeps
# its tag — a USB remote or a keyboard's consumer-control endpoint can emit
# KEY_POWER or KEY_RESTART too, and there is no reason for either to reach
# init on a television.
#
# Restarting and shutting down stay possible: they are requests to
# mediaboxd-rs, made from Settings with a confirmation, and over SSH.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
