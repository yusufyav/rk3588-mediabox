# The interface's display loop runs at SCHED_FIFO, as Android's
# SurfaceFlinger does, so a busy CPU cannot hold a film frame past its
# vblank. The Rockchip kernel is built with CONFIG_RT_GROUP_SCHED, and with
# the cgroup cpu controller on, every service's group has no real-time
# budget: SCHED_FIFO is refused, root or not. Nothing here sets CPUWeight=
# or CPUQuota=, so the controller is not turned on at all.
#
# Measured 2026-11-01, NTV 1080i50 under 4 spinning threads and 2 copying
# memory: 77 frames skipped in 25 minutes at an ordinary priority, 16 in 10
# at nice -10.
[Manager]
DefaultCPUAccounting=no
