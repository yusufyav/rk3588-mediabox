# bluez-alsa as this appliance uses it: sound from the box to a headset or
# speaker (a2dp-source) and nothing else. Debian's unit also starts the
# a2dp-sink profile, which makes the box a speaker any phone in the room can
# play to; that is not this product, so it is not offered to bluez at all.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --a2dp-volume
