# Secure default: loopback only. A reverse proxy can provide the same-origin UI.
bind_address = "127.0.0.1"
port = 8787
allow_lan = false
log_level = "INFO"
event_poll_seconds = 2.0
webui_root = "/opt/rk3588-mediabox/webui/dist"

# Disabled unless an operator explicitly enables it. Even then, the caller's
# source address must match one of these networks.
system_actions_enabled = false
system_actions_allow_cidrs = ["127.0.0.0/8", "::1/128"]

[kodi]
# Kodi runs in its own systemd unit. mediaboxd starts and stops that unit and
# never spawns Kodi itself: a child of this daemon inherits this daemon's
# sandbox, and the address-family filter alone leaves Kodi with no udev monitor
# and therefore no keyboard.
unit = "kodi.service"
# Empty means: discover the port/TLS/auth settings from the running Kodi HOME,
# then from settings_paths. An override must be a complete http(s) URL.
endpoint = ""
settings_paths = ["/var/tmp/kodi-home/.kodi/userdata/guisettings.xml"]
request_timeout_seconds = 2.0

# Accepted production lifecycle from the S0/S1 evidence. mediaboxd invokes the
# executable directly with an argv vector; these values are never a shell line.
executable = "/opt/rk3588-mediabox/kodi/lib/kodi/kodi-gbm"
arguments = ["--standalone", "--debug"]
working_directory = "/var/tmp/kodi-home"
home = "/var/tmp/kodi-home"
stdout_path = "/var/tmp/kodi-home/kodi-stdout.log"
start_timeout_seconds = 20.0
stop_timeout_seconds = 12.0

[kodi.environment]
AE_SINK = "ALSA"
MEDIABOX_GPU = "mali"
LD_LIBRARY_PATH = "/opt/rk3588-mediabox/mali-g24p0-runtime/lib:/opt/rk3588-screenbridge/lib"

# Stremio boundary. The streaming server is a local subprocess; only mediaboxd
# talks to it, and the browser reaches it exclusively below `mount` on this
# origin. `upstream` must stay loopback: it is validated as such at load time so
# the mount can never become an open proxy.
[stremio]
enabled = true
upstream = "http://127.0.0.1:11470"
# The origin root. stremio-video builds its transcoding URLs against the
# origin, so a streaming server behind a subpath cannot transcode. mediaboxd
# keeps /api/, /ui/, /media/ and / for itself; everything else is the
# streaming server.
mount = "/"
# Offered to Stremio as an `external` playback device. `external` is the only
# device type upstream stremio-web renders in a plain browser.
cast_device_id = "mediabox-tv"
cast_device_name = "MediaBox TV (Kodi)"
request_timeout_seconds = 10.0
# A cold torrent finds peers and fetches a piece before it can answer at all.
stream_timeout_seconds = 120.0

# The V2 media core, mounted at /media/.
#
# It is what decides whether a source can play on this appliance as it stands,
# which audio track to use, and whether anything has to be converted first. It
# never re-encodes video. A source needing more than a stream copy gets a media
# session, and every session owns its ffmpeg process from start to reap.
[media]
enabled = true
# A profile in media/policy/capabilities.py. Omitted, the production profile
# for this board is used.
# capability_profile = "rk3588_orangepi5_production"
# Where a Stremio auth key is kept if an account is ever signed in. Set to ""
# to keep nothing on disk; the media core works signed out, on Stremio's
# default addon collection.
state_path = "/var/lib/mediaboxd/media-session.json"
# Absolute directories a file:// source may be read from. Empty — the default —
# means the media core plays nothing off the local filesystem.
allowed_file_prefixes = []
# How long a session with no reader survives before it is ended. A session
# nobody is watching is a core nobody is using.
idle_timeout_seconds = 45.0
