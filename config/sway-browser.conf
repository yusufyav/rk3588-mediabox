# MediaBox television kiosk.
#
# sway is here for what cage does not have: a window it can make fullscreen
# without the browser asking for it.
# The output mode is measured, not chosen here and not left to wlroots.
#
# It was pinned to 1920x1080 in this file once, which drove a 4K television at
# a quarter of its pixels and a 1440p monitor at a mode it has to rescale. So
# it was handed to wlroots instead -- and wlroots takes the sink's *preferred*
# mode, which on a 4K television whose link cannot carry 2160p60 is
# 1920x1080p60. Same wrong answer, arrived at politely: measured on the Plus,
# opening the browser took the panel from 3840x2160p30 to 1920x1080p60 and
# back again, two resynchronisations and a page at a quarter size.
#
# `mediabox-hdmi-prepare` works out what this board's cable can actually carry
# -- the largest timing in the panel's own shape that the link takes as RGB --
# and writes it here as one line. It is the same answer the interface uses,
# the same one Kodi's whitelist is built from and the same one the kernel's
# framebuffer is given, so the television keeps one mode across every
# handover. A board where that step has not run yet falls back to wlroots,
# which is where this started; nothing here fails for the want of the file.
include /run/mediabox/sway-output.conf
# No background, and that is the whole reason this browser can scan out
# directly.
#
# `output * bg` is not a colour setting, it is a scene node: a rectangle the
# size of the output, sitting under everything. wlroots will only hand a
# client's buffer straight to the display controller when the render list holds
# exactly one node, and Chromium's surface is ABGR8888 -- it has an alpha
# channel, so the compositor may not assume it covers what is behind it and
# cannot drop the rectangle. Two nodes, and direct scanout is never even
# attempted. Measured: with this line the plane carried wlroots' own XR24
# composite; with it gone the plane carries Chromium's AB24 and sway logs
#
#     [wlr] [types/scene/wlr_scene.c:1858] Direct scan-out enabled
#
# Nothing is lost visually. wlroots clears whatever no node covers to opaque
# black as part of building the frame, which is what this line was painting
# anyway -- it just did it as a node, and the node was the problem.

# Nothing but the page: no borders, no title bars, no gaps, no cursor.
default_border none
default_floating_border none
hide_edge_borders --i3 both
gaps inner 0
gaps outer 0
seat * hide_cursor 1
seat * hide_cursor when-typing enable

# The remote and any USB keyboard belong to the page, not to the window
# manager. Every default binding is dropped so a stray key cannot close the
# kiosk, switch workspaces or open a terminal.
set $mod Mod4
bindsym --to-code $mod+Shift+q nop
floating_modifier none

# A browser crash must not leave a bare compositor on the television: systemd
# restarts the unit, so the compositor exits with the browser.
# The browser is launched by a script of its own: sway's parser splits on
# "," and ";" and has no line continuation, so Chromium's flags cannot be
# written here without being quietly mangled.
exec /opt/rk3588-mediabox/bin/mediabox-browser

# Getting out.
#
# The browser has no chrome — no tabs, no address bar, no window buttons — so
# without this the only way off a web page was to stop the unit from another
# machine. These are the keys a television remote sends through CEC on this
# board, plus one a plugged-in keyboard can reach. Each hands the display back
# to the product interface through the control plane, which stops this unit as
# part of the handover: the browser does not decide it is finished, whoever
# owns the display does.
#
# A script rather than the command itself, for the same reason the browser is
# one: sway splits a command at "," and ";", and the request body is JSON.
bindsym --to-code XF86Back exec /opt/rk3588-mediabox/bin/mediabox-handback
bindsym --to-code XF86HomePage exec /opt/rk3588-mediabox/bin/mediabox-handback
bindsym --to-code XF86AudioMedia exec /opt/rk3588-mediabox/bin/mediabox-handback
bindsym --to-code Mod4+Escape exec /opt/rk3588-mediabox/bin/mediabox-handback
