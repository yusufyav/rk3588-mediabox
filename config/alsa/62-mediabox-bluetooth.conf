# The Bluetooth headset or speaker, as one PCM Kodi can list.
#
# bluez-alsa's own `bluealsa` PCM shows in a device list only with
# `defaults.namehint.extended` on, which nothing here turns on, so Kodi never
# offered it. This is that PCM under a name with its hint shown: the A2DP
# device connected last -- bluez-alsa's own default for DEV -- through a plug,
# so any sample format reaches it. Its volume is bluez-alsa's, which
# mediaboxd-rs sets from the kept setting.
pcm.mediabox_bluetooth {
	type plug
	slave.pcm {
		type bluealsa
		device "00:00:00:00:00:00"
		profile "a2dp"
	}
	hint {
		show on
		description "MediaBox: Bluetooth kulaklık"
	}
}
