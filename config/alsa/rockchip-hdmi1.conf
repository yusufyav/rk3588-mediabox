#
# HDMI compressed-audio (IEC61937) PCM for the RK3588 "rockchip-hdmi1" card.
#
# Installed as /usr/share/alsa/cards/rockchip-hdmi1.conf, where alsa-lib's
# `load_for_all_cards` hook picks it up by the card's *driver* name and exposes
# it as `cards.rockchip-hdmi1` (and, by card index, `cards.0`). That is what the
# stock /usr/share/alsa/pcm/hdmi.conf resolves its slave through, so adding this
# one file is what makes `hdmi:CARD=rockchiphdmi1,DEV=0` exist at all.
#
# Why this is needed (Gate MA1, fault domain B):
# Kodi decides whether a device can do passthrough in
# CAESinkALSA::AEDeviceTypeFromName() -- purely from the ALSA PCM *name*:
# only a name starting with "hdmi" becomes AE_DEVTYPE_HDMI, and only
# AE_DEVTYPE_HDMI gets AE_FMT_RAW and the AC3/DTS/EAC3 stream types pushed onto
# it. This card advertised only `default`, `sysdefault:CARD=rockchiphdmi1` and
# `hw:CARD=rockchiphdmi1`, so Kodi enumerated it as AE_DEVTYPE_PCM and logged
# "No passthrough capabilities" for every device. Nothing was wrong in the
# kernel: the low-level proof (ffmpeg -c:a copy -f spdif | aplay -D hw:0,0)
# played real AC3 to the sink. The only thing missing was the name.
#
# Modelled on the stock HDA-Intel.conf, not on vc4-hdmi.conf. vc4-hdmi wraps the
# stream in `type iec958` because that hardware needs the IEC958 sub-frames
# built in software. The dw-hdmi-qp controller here does the IEC60958 framing
# itself and takes the IEC61937 burst as plain S16_LE stereo -- exactly what the
# low-level proof fed it -- so a software subframe converter would corrupt it.
#
# The ctl_elems hook is the part that carries the proof over: it writes the AES
# channel-status bytes into "IEC958 Playback Default" for the life of the
# stream. Kodi passes AES0=0x06 for passthrough, whose bit 1 is the non-audio
# flag. That flag is what tells the sink the stereo frames are a compressed
# burst and not PCM; with the card's default AES0=0x04 the same bytes decode as
# white noise. `preserve true` puts the byte back on close, so the PCM path that
# Gate MA0 validated is left exactly as it was.
#
# Only pcm.hdmi.0 is defined. `default`/`sysdefault` are deliberately left
# untouched: audiooutput.audiodevice still points at sysdefault and must keep
# resolving to the same PCM chain it did before this file existed.
#

rockchip-hdmi1.pcm.hdmi.0 {
	@args [ CARD AES0 AES1 AES2 AES3 ]
	@args.CARD {
		type string
	}
	@args.AES0 {
		type integer
	}
	@args.AES1 {
		type integer
	}
	@args.AES2 {
		type integer
	}
	@args.AES3 {
		type integer
	}
	type hooks
	slave.pcm {
		type hw
		card $CARD
		device 0
	}
	hooks.0 {
		type ctl_elems
		hook_args [
		{
			name "IEC958 Playback Default"
			interface PCM
			optional true
			lock true
			preserve true
			value [ $AES0 $AES1 $AES2 $AES3 ]
		}
		]
	}
}
