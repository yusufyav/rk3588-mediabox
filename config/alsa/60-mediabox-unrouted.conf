# Where sound goes when it must go nowhere.
#
# The sound card of the output the picture is on is known only when the
# connector is firmly tied to its transmitter (mediabox_platform::Output::
# audio_route). When it is not -- two televisions on two HDMI sockets that
# nothing tells apart -- sending sound to "the likely card" reaches a different
# television as surely as a CEC command would. Kodi, given no card, falls back
# to ALSA's default, which is card 0. So it is given this instead: a PCM that
# discards every sample, named for what it is.
pcm.mediabox_unrouted {
	type null
	hint {
		show on
		description "MediaBox: ses çıkışı belirsiz, gönderilmiyor"
	}
}
