# The box's own volume, for PCM.
#
# One definition, for whichever card the sound setting chose: the caller names
# it -- `mediabox_volume:CARD=<id>,DEV=<n>` -- the way `hdmi:CARD=<id>` is
# named, so nothing here is one board's answer and nothing has to be written at
# run time (the units that start players see /etc read-only).
#
# ALSA's softvol, behind a plug so any sample format reaches it, in front of a
# plug so the card gets one it takes. Its control, "MediaBox" on that card,
# runs 0 to 100 over -40 dB to 0 dB, and 0 is silence; mediaboxd-rs sets it
# from the kept setting. A compressed burst never comes this way: Kodi's
# passthrough device and the player's are the card's own `hdmi:` PCM, so a
# bitstream is never volume-scaled.
pcm.mediabox_volume {
	@args [ CARD DEV ]
	@args.CARD {
		type string
	}
	@args.DEV {
		type integer
		default 0
	}
	type plug
	slave.pcm {
		type softvol
		slave.pcm {
			type plug
			slave.pcm {
				type hw
				card $CARD
				device $DEV
			}
		}
		control {
			name "MediaBox"
			card $CARD
		}
		min_dB -40.0
		max_dB 0.0
		resolution 101
	}
	hint {
		show on
		description "MediaBox: ses seviyesi uygulanan PCM"
	}
}
