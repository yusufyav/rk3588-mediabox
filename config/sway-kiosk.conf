# MediaBox television kiosk.
#
# sway is here for what cage does not have: a window it can make fullscreen
# without the browser asking for it, and output events it can be told about.
# The output mode is the panel's to decide.
#
# It was written down here, twice: first `mode 1920x1080@60Hz` on the argument
# that a 1080p interface should not be composited at 4K, then
# `mode 3840x2160@60Hz` on the argument that the television rescales 1080p with
# someone else's resampler and every letter pays for it. The second argument is
# the right one — but both of them are statements about one particular panel,
# and this appliance is plugged into whatever the house has.
#
# Measured on a 2560x1440 monitor, the pinned 4K line produced:
#
#   [sway/config/output.c:887] Requested backend configuration failed, searching for valid fallbacks
#   [sway/config/output.c:896] Search for valid config failed
#
# — a failed mode set followed by a fallback, which is the television going
# dark twice on its way to the home screen.
#
# Left unwritten, wlroots takes the mode the panel says it prefers: 4K60 on a
# 4K set, 1440p on this monitor, 1080p on an older television. The layout does
# not change with it, because the browser is given a scale factor measured from
# whatever mode was actually taken — see mediabox-display-scale — so the page
# is laid out in 1920 logical pixels and rasterised at the panel's own
# resolution on every one of them.
output * bg #07080b solid_color

# A panel can be swapped while the box is running, and the browser's scale
# factor is fixed at launch. This notices and brings the interface back at the
# right scale.
exec /opt/rk3588-mediabox/bin/mediabox-display-watch

# Coming back from Kodi, the panel has twice latched onto something and shown
# green with a correct signal behind it. This blanks and unblanks the output
# once, on that path only.
exec /opt/rk3588-mediabox/bin/mediabox-display-settle

# Nothing but the page: no borders, no title bars, no gaps, no cursor.
default_border none
default_floating_border none
hide_edge_borders --i3 both
gaps inner 0
gaps outer 0
seat * hide_cursor 1
seat * hide_cursor when-typing enable

# The remote and any USB keyboard belong to the page, not to the window
# manager. Every default binding is dropped so a stray key cannot close the
# kiosk, switch workspaces or open a terminal.
set $mod Mod4
bindsym --to-code $mod+Shift+q nop
floating_modifier none

# The television remote is the daemon's to interpret, not this compositor's.
#
# The kernel's CEC driver publishes an input device as well as talking to
# mediaboxd-rs, so one press of Right on the remote arrives twice: once here as
# an ordinary key, and once on the daemon's normalised input bus. Acting on both
# walks the focus two tiles for every press.
#
# The daemon is the authority — it is what the phone remote and an injected
# action already go through, and it is what knows whether Kodi or the interface
# should receive a transport key — so the duplicate is cut off at the source.
# `dw_hdmi_qp` is rc0's input device, at
# /devices/platform/fdea0000.hdmi/rc/rc0/input0; USB and Bluetooth keyboards are
# untouched and still arrive here directly, which is the shortest path they have.
#
# The daemon does not EVIOCGRAB anything, so switching the device off here does
# not affect its own reading of it.
input "0:0:dw_hdmi_qp" events disabled

# An interface crash must not leave a bare compositor on the television: systemd
# restarts the unit, so the compositor exits with the interface.
# It is launched by a script of its own: sway's parser splits on "," and ";" and
# has no line continuation, so nothing with arguments can be written here
# without being quietly mangled.
#
# Matched by title rather than by app_id: the interface sets one and it is part
# of the contract, but the title is also what mediabox-kiosk-smoke asserts is on
# the panel, and having one name to keep in step is better than two.
for_window [title="^MediaBox$"] fullscreen enable, border none
# The browser application runs under its own compositor config, but a window of
# its kind appearing here should still wear no frame.
for_window [app_id="chromium"] fullscreen enable, border none
# The player is a client of this compositor, not a takeover of the display:
# a film opens inside the application and Back returns to it.
for_window [app_id="mpv"] fullscreen enable, border none

exec /opt/rk3588-mediabox/bin/mediabox-tv-native
