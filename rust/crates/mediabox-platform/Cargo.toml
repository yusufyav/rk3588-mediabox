# What this board actually is, asked of the board.
#
# One crate, because the alternative is the same three questions answered
# slightly differently in the television interface, in the control plane and in
# four shell scripts — which is how an appliance ends up working on the board it
# was written on and nowhere else.
[package]
name = "mediabox-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediabox-core = { path = "../mediabox-core" }
serde.workspace = true
serde_json.workspace = true
# The observer's uevent socket and its guarded, read-only DRM query.
libc.workspace = true
# The canonical EDID identity is the SHA-256 of the bytes received.
sha2 = "0.10.9"

[[bin]]
name = "mediabox-platform"
path = "src/main.rs"

# The display, observed from outside whoever owns it: its hardware state.
[[bin]]
name = "mediabox-display-observer"
path = "src/bin/mediabox-display-observer.rs"

[dev-dependencies]
tempfile = "3.27.0"
