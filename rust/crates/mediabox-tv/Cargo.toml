# The television's own interface.
#
# Its own workspace, for the reason mediabox-ui has one: a UI framework's
# dependency tree is several times the size of the control plane's, and a
# dependency of this crate must never be able to move a lockfile entry under
# mediaboxd-rs. `cargo test` in rust/ stays the appliance's own tree.
[workspace]

[package]
name = "mediabox-tv"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "mediabox-tv"
path = "src/main.rs"

[dependencies]
# A custom direct-KMS platform, drawn by FemtoVG on GLES. Not the default feature set:
# `accessibility` pulls AT-SPI over D-Bus and there is no session bus on the
# appliance, and there is no tray on a television. The software renderer is left
# out too — this board has a GPU and a 4K panel, and a CPU rasteriser at that
# size is not a fallback, it is a slideshow.
slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "renderer-femtovg",
    # So the window system's own complaints reach the journal. A client that
    # cannot get a surface says so through `log`, and without a logger installed
    # it says it into nothing — which is how a blank television looked like a
    # working process for an afternoon.
    "log",
] }

mediabox-core = { path = "../mediabox-core" }
# What board this is, asked of the board. The same crate the control plane and
# the shell scripts use, so there is one answer rather than three.
mediabox-platform = { path = "../mediabox-platform" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# Artwork comes from third-party hosts over TLS. The daemon's HTTP client is
# deliberately built without TLS because every origin it talks to is loopback;
# that property is worth keeping, so the television fetches its own pictures.
# webpki-roots rather than the system store: the appliance need not carry one.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
libc = "0.2.189"
drm = "0.14.1"
gbm = { version = "0.18.0", default-features = false, features = ["drm-support"] }
glutin = { version = "0.32.3", default-features = false, features = ["egl"] }
raw-window-handle = "0.6.2"
input = "0.10.0"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
