# The product UI is its own workspace on purpose.
#
# It is the only crate here that targets wasm32, and it pulls a UI framework
# with a dependency tree several times the size of the control plane's. Keeping
# it out of the daemon's workspace means `cargo test` for the appliance stays
# the appliance's own tree, and a UI dependency can never move a lockfile entry
# under mediaboxd-rs.
[workspace]

[package]
name = "mediabox-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Pinned exactly: the generated glue must match the wasm-bindgen-cli that
# emits it, so the version is part of the build contract, not a range.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console", "Document", "DomRect", "Element", "Event", "EventSource", "FocusOptions",
  "EventTarget", "Headers", "HtmlElement", "HtmlInputElement", "KeyboardEvent",
  "Location", "MessageEvent", "NodeList", "Request", "RequestInit", "Response", "Storage",
  "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window",
]

[profile.release]
# The bundle is fetched over the LAN by a television; size is the thing that
# matters, and the UI does no arithmetic that needs the optimiser's speed.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
