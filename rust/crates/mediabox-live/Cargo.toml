# Live television's own player: a broadcast's transport stream, demultiplexed
# and timed by GStreamer, decoded by Rockchip MPP, shown on the interface's
# video plane and heard over ALSA.
#
# Its own workspace, for the reason mediabox-tv has one: GStreamer's binding
# tree must never be able to move a lockfile entry under mediaboxd-rs.
[workspace]

[package]
name = "mediabox-live"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Faults made on purpose (`MEDIABOX_LIVE_FAULT`, src/health.rs), to show
# the monitor sees them. Off in every product build: the variable is not
# read and none of the faults is in the binary. A diagnostic build asks:
#   cargo build --release --features fault-injection
[features]
fault-injection = []

[[bin]]
name = "mediabox-live"
path = "src/main.rs"

[dependencies]
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.25", features = ["v1_24"] }
gst-allocators = { package = "gstreamer-allocators", version = "0.25" }
mediabox-core = { path = "../mediabox-core" }
serde_json = "1.0.149"
libc = "0.2.189"

[build-dependencies]
# Already in the tree (system-deps'): the headers and libraries
# src/gst_abi.c is built against.
pkg-config = "0.3.34"

# The player's own code tested as the product runs it (opt-level 3): the
# sound clock's cost test measures it against real time
# (audio_clock_tests, the heaviest broadcast sound).
[profile.test.package.mediabox-live]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
