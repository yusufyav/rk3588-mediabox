[package]
name = "mediabox-dvb"
version.workspace = true
edition.workspace = true
license.workspace = true

# The satellite receiver's own process: the USB device, the LNB and the
# transport stream belong to it and to nothing else. libusb is opened at run
# time (dlopen), not linked, so the cross build needs no aarch64 libusb.
[dependencies]
clap.workspace = true
libc.workspace = true
mediabox-core = { path = "../mediabox-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# A transport hole made on purpose, for a measurement (`src/inject.rs`).
# Off in every product build: the receiver's output never passes through
# it, and none of it is in the binary. A diagnostic build asks for it:
#   cargo build --release -p mediabox-dvb --features transport-injection
[features]
transport-injection = []

[[bin]]
name = "mediabox-dvb"
path = "src/bin/mediabox-dvb.rs"
