[workspace]
resolver = "2"
members = [
    "crates/mediabox-core",
    "crates/mediabox-cec",
    "crates/mediabox-input",
    "crates/mediabox-platform",
    "crates/mediaboxd-rs",
    "crates/mediaboxctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
